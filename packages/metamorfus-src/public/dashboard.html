<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metamorfos ODC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    background: #050b18;
    overflow: hidden;
    font-family: 'Helvetica Neue', 'Inter', system-ui, sans-serif;
  }

  #scene {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* Vignette: keep edges dark so the swirl is the focal point. */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 30%, rgba(5, 11, 24, 0.55) 70%, #050b18 100%);
  }

  /* Brand mark + wordmark, positioned to the right of the swirl. */
  .wordmark {
    position: fixed;
    top: 50%;
    right: 8%;
    transform: translateY(-50%);
    z-index: 5;
    color: #e0f7fa;
    text-align: left;
    user-select: none;
  }

  .wordmark .name {
    display: block;
    font-size: clamp(48px, 6.5vw, 120px);
    font-weight: 300;
    letter-spacing: -0.01em;
    line-height: 1;
    background: linear-gradient(180deg, #f0fdff 0%, #67e8f9 55%, #14b8a6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(34, 211, 238, 0.18);
    white-space: nowrap;
  }

  .wordmark .sub {
    display: block;
    margin-top: 14px;
    font-size: clamp(36px, 5vw, 90px);
    font-weight: 300;
    letter-spacing: 0.02em;
    background: linear-gradient(180deg, #67e8f9 0%, #22d3ee 60%, #14b8a6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
  }

  /* Subtle tag below the wordmark. */
  .tagline {
    margin-top: 28px;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(180, 220, 240, 0.45);
    font-weight: 300;
  }

  /* Top-left small mark. */
  .corner {
    position: fixed;
    top: 28px;
    left: 32px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(180, 220, 240, 0.55);
    user-select: none;
  }

  .corner-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #67e8f9;
    box-shadow: 0 0 10px #67e8f9;
    animation: pulse 2.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(0.7); }
  }

  /* Top-right build tag. */
  .build {
    position: fixed;
    top: 28px;
    right: 32px;
    z-index: 5;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(180, 220, 240, 0.35);
    user-select: none;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="vignette"></div>

<div class="corner">
  <span class="corner-dot"></span>
  <span>Cortex online</span>
  <span style="opacity:0.4; margin: 0 8px;">/</span>
  <span>MHU 5.0</span>
  <span style="opacity:0.4; margin: 0 8px;">/</span>
  <span>DNA Library persistent</span>
</div>

<div class="build">Build 2026 · AN-design</div>

<div class="wordmark">
  <span class="name">Metamorfos</span>
  <span class="sub">ODC</span>
  <div class="tagline">Autonomous · Self-improving · Cross-profession</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─── Renderer ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050b18);
scene.fog = new THREE.FogExp2(0x050b18, 0.035);

// Camera framed so the swirl sits on the LEFT and the wordmark on the RIGHT.
const camera = new THREE.PerspectiveCamera(
  46,
  window.innerWidth / window.innerHeight,
  0.1,
  100,
);
camera.position.set(2.2, 0, 8.5);
camera.lookAt(-0.6, 0, 0);

// ─── Lights ────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x1e3a5f, 0.5);
scene.add(ambient);

const key = new THREE.DirectionalLight(0x67e8f9, 1.0);
key.position.set(3, 4, 4);
scene.add(key);

const fill = new THREE.DirectionalLight(0x22d3ee, 0.6);
fill.position.set(-3, -2, 2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x14b8a6, 0.7);
rim.position.set(0, -3, -3);
scene.add(rim);

const accent = new THREE.PointLight(0x67e8f9, 1.2, 16);
accent.position.set(-2, 1, 2);
scene.add(accent);

// ─── Ribbon builder ───────────────────────────────────────────────────────
// Build a single ribbon mesh from a list of points with a given thickness
// and color gradient. The mesh is a TubeGeometry swept along a
// CatmullRomCurve3 — gives the smooth flowing look the logo has.
function makeRibbon(points, opts = {}) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
  const segments = opts.segments ?? 280;
  const radius = opts.radius ?? 0.05;
  const radial = opts.radial ?? 10;
  const geometry = new THREE.TubeGeometry(curve, segments, radius, radial, false);

  const count = geometry.attributes.position.count;
  const colors = new Float32Array(count * 3);
  const c1 = new THREE.Color(opts.colorA ?? 0x67e8f9);
  const c2 = new THREE.Color(opts.colorB ?? 0x14b8a6);
  const tmp = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const t = i / count;
    // Slight banding — looks like the highlight banding in the reference.
    const band = 0.85 + 0.15 * Math.sin(t * 18 + opts.bandOffset ?? 0);
    tmp.copy(c1).lerp(c2, t).multiplyScalar(band);
    colors[i * 3 + 0] = tmp.r;
    colors[i * 3 + 1] = tmp.g;
    colors[i * 3 + 2] = tmp.b;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    metalness: 0.7,
    roughness: 0.2,
    emissive: opts.emissive ?? 0x22d3ee,
    emissiveIntensity: 0.5,
    transparent: true,
    opacity: 0.95,
  });

  const mesh = new THREE.Mesh(geometry, material);
  if (opts.position) mesh.position.set(...opts.position);
  if (opts.rotation) {
    mesh.rotation.x = opts.rotation[0];
    mesh.rotation.y = opts.rotation[1];
    mesh.rotation.z = opts.rotation[2];
  }
  return { mesh, geometry, material };
}

// ─── Curve generators ─────────────────────────────────────────────────────
// All curves are in the YZ plane (vertical spiral) — the swirl in the
// reference image is clearly vertical, not horizontal. The camera
// frames it from a slight 3/4 angle.

// Curve A: the BIG primary ribbon — a vertical spiral that comes in
// from the top, curves around the right, dips through the center, and
// exits down to the lower-left. This is the dominant swirl.
function bigSpiral() {
  const pts = [];
  const N = 160;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    // Parametric spiral: angle increases with t, radius oscillates so
    // the ribbon coils inward then back out.
    const angle = -Math.PI * 1.5 + t * Math.PI * 2.6;
    const radius = 1.4 + 0.55 * Math.sin(t * Math.PI * 1.4);
    const x = Math.cos(angle) * radius - 0.4;
    const y = (t - 0.5) * 3.6 + Math.sin(t * Math.PI * 1.2) * 0.35;
    const z = Math.sin(angle) * radius * 0.6 + 0.5;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

// Curve B: a counter-rotating inner spiral that crosses through the
// main one — gives the woven/intertwined look the reference has.
function innerSpiral() {
  const pts = [];
  const N = 140;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const angle = Math.PI * 1.3 - t * Math.PI * 2.2;
    const radius = 0.95 + 0.3 * Math.sin(t * Math.PI * 1.6 + 0.5);
    const x = Math.cos(angle) * radius - 0.4;
    const y = (t - 0.5) * 3.2 + Math.cos(t * Math.PI * 1.4) * 0.3;
    const z = Math.sin(angle) * radius * 0.7 + 0.2;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

// Curve C: a long top-to-bottom diagonal sweep — the ribbon that
// crosses the whole swirl vertically like a slash.
function diagonalSlash() {
  const pts = [];
  const N = 80;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = (t - 0.5) * 0.9 - 0.4 + Math.sin(t * Math.PI * 0.6) * 0.4;
    const y = (t - 0.5) * 4.2;
    const z = (1 - t) * 1.0 - 0.2;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

// Curve D: a wide arc that ties the bottom of the swirl together,
// giving the swirl a closed feel at the base.
function bottomArc() {
  const pts = [];
  const N = 60;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const angle = -Math.PI * 0.2 + t * Math.PI * 0.9;
    const x = Math.cos(angle) * 1.7 - 0.4;
    const y = -1.7 + Math.sin(t * Math.PI) * 0.15;
    const z = Math.sin(angle) * 0.6 - 0.3;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

const ribbons = [
  // Primary big spiral — the dominant swirl.
  makeRibbon(bigSpiral(), {
    colorA: 0x67e8f9,
    colorB: 0x14b8a6,
    radius: 0.085,
    emissive: 0x22d3ee,
    emissiveIntensity: 0.65,
    bandOffset: 0,
  }),
  // Inner counter-rotating spiral — the woven effect.
  makeRibbon(innerSpiral(), {
    colorA: 0x22d3ee,
    colorB: 0x3b82f6,
    radius: 0.055,
    emissive: 0x3b82f6,
    emissiveIntensity: 0.55,
    bandOffset: 1.7,
  }),
  // Diagonal slash — the long vertical stroke through the swirl.
  makeRibbon(diagonalSlash(), {
    colorA: 0x67e8f9,
    colorB: 0x22d3ee,
    radius: 0.05,
    emissive: 0x14b8a6,
    emissiveIntensity: 0.55,
    bandOffset: 2.3,
  }),
  // Bottom tie-in arc.
  makeRibbon(bottomArc(), {
    colorA: 0x14b8a6,
    colorB: 0x67e8f9,
    radius: 0.045,
    emissive: 0x22d3ee,
    emissiveIntensity: 0.5,
    bandOffset: 0.9,
  }),
];

ribbons.forEach((r) => scene.add(r.mesh));

// ─── Floating cube accents ───────────────────────────────────────────────
// A few small cubes around the swirl like the reference. Cyan/teal
// metallic, slightly emissive.
function makeCube(size, color, emissive) {
  const g = new THREE.BoxGeometry(size, size, size);
  const m = new THREE.MeshStandardMaterial({
    color,
    metalness: 0.95,
    roughness: 0.18,
    emissive: emissive ?? color,
    emissiveIntensity: 0.45,
  });
  return new THREE.Mesh(g, m);
}

const cubes = [
  { mesh: makeCube(0.36, 0x67e8f9, 0x22d3ee), pos: [-1.6, 2.0, -0.4] },
  { mesh: makeCube(0.42, 0x14b8a6, 0x14b8a6), pos: [0.6, 1.6, 0.6] },
  { mesh: makeCube(0.32, 0x22d3ee, 0x22d3ee), pos: [-2.2, 0.0, 0.3] },
  { mesh: makeCube(0.38, 0x67e8f9, 0x22d3ee), pos: [-0.8, -2.2, -0.5] },
  { mesh: makeCube(0.30, 0x14b8a6, 0x14b8a6), pos: [0.4, -1.6, 0.4] },
  { mesh: makeCube(0.34, 0x22d3ee, 0x22d3ee), pos: [-1.8, -0.8, 0.9] },
];
cubes.forEach(({ mesh, pos }) => {
  mesh.position.set(...pos);
  mesh.userData.basePos = [...pos];
  scene.add(mesh);
});

// Small wireframe cubes for the geometric feel in the reference.
function makeWireCube(size, color) {
  const g = new THREE.EdgesGeometry(new THREE.BoxGeometry(size, size, size));
  const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55 });
  return new THREE.LineSegments(g, m);
}
const wireCubes = [
  { mesh: makeWireCube(0.55, 0x67e8f9), pos: [-2.6, 1.2, 0.1] },
  { mesh: makeWireCube(0.45, 0x14b8a6), pos: [0.4, 0.7, 0.9] },
  { mesh: makeWireCube(0.5, 0x22d3ee), pos: [-1.2, -1.0, 0.8] },
];
wireCubes.forEach(({ mesh, pos }) => {
  mesh.position.set(...pos);
  scene.add(mesh);
});

// ─── Particle dust ────────────────────────────────────────────────────────
const PCOUNT = 400;
const positions = new Float32Array(PCOUNT * 3);
const sizes = new Float32Array(PCOUNT);
for (let i = 0; i < PCOUNT; i++) {
  positions[i * 3]     = (Math.random() - 0.5) * 22;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 14;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 18 - 4;
  sizes[i] = Math.random() * 1.4 + 0.3;
}
const pgeom = new THREE.BufferGeometry();
pgeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const pmat = new THREE.PointsMaterial({
  color: 0x67e8f9,
  size: 0.04,
  transparent: true,
  opacity: 0.55,
  sizeAttenuation: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const particles = new THREE.Points(pgeom, pmat);
scene.add(particles);

// ─── Animation ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  // Ribbons drift — subtle, never frenetic.
  ribbons.forEach((r, i) => {
    r.mesh.rotation.y = Math.sin(t * 0.1 + i * 0.7) * 0.05;
    r.mesh.rotation.x = Math.cos(t * 0.08 + i * 0.5) * 0.04;
    r.mesh.rotation.z = Math.sin(t * 0.12 + i * 1.3) * 0.03;
  });

  // Cubes rotate gently.
  cubes.forEach(({ mesh }, i) => {
    mesh.rotation.x = t * 0.3 + i * 0.6;
    mesh.rotation.y = t * 0.45 + i * 0.9;
    mesh.position.y = mesh.userData.basePos[1] + Math.sin(t * 0.7 + i * 1.4) * 0.05;
  });
  wireCubes.forEach(({ mesh }, i) => {
    mesh.rotation.x = -t * 0.2 - i * 0.4;
    mesh.rotation.y = t * 0.18 + i * 0.7;
  });

  // Particles drift.
  const arr = pgeom.attributes.position.array;
  for (let i = 0; i < PCOUNT; i++) {
    arr[i * 3 + 1] += Math.sin(t * 0.15 + i) * 0.0015;
    if (arr[i * 3 + 1] > 8) arr[i * 3 + 1] = -8;
  }
  pgeom.attributes.position.needsUpdate = true;

  // Camera idle parallax.
  camera.position.x = 2.2 + Math.sin(t * 0.08) * 0.12;
  camera.position.y = 0 + Math.cos(t * 0.07) * 0.08;
  camera.lookAt(-0.6, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
